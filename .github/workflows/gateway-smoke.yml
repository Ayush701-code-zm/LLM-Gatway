name: Gateway Smoke (LLM)

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'API base URL (default http://localhost:3001 when stack is started in-job)'
        required: false
        default: 'http://localhost:3001'
        type: string

# Optional job — requires at least one LLM provider secret.
# Runs the full test-gateway.sh pipeline (real chat + semantic cache).
jobs:
  gateway-smoke:
    name: Full Gateway Smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER:     smartroute
          POSTGRES_PASSWORD: smartroute
          POSTGRES_DB:       smartroute_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smartroute -d smartroute_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        command: redis-server --maxmemory-policy noeviction
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      NODE_VERSION: '22'
      NODE_ENV: test
      API_KEY_ENCRYPTION_SECRET: test-secret-32-chars-padding-xxxx
      JWT_SECRET: test-jwt-secret-for-ci-pipeline
      JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-ci-pipeline
      DATABASE_URL: postgresql://smartroute:smartroute@localhost:5432/smartroute_test
      DIRECT_URL: postgresql://smartroute:smartroute@localhost:5432/smartroute_test
      REDIS_URL: redis://localhost:6379
      CORS_ORIGINS: http://localhost:3000
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Check LLM provider keys
        id: keys
        run: |
          if [[ -z "$OPENAI_API_KEY" && -z "$ANTHROPIC_API_KEY" && -z "$GOOGLE_GENERATIVE_AI_API_KEY" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No LLM provider secrets configured — add OPENAI_API_KEY, ANTHROPIC_API_KEY, or GOOGLE_GENERATIVE_AI_API_KEY."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.keys.outputs.configured == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-python@v5
        if: steps.keys.outputs.configured == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.keys.outputs.configured == 'true'
        run: npm ci --ignore-scripts

      - name: Build shared package
        if: steps.keys.outputs.configured == 'true'
        run: npm run build --workspace=packages/shared

      - name: Generate Prisma client + migrate + seed
        if: steps.keys.outputs.configured == 'true'
        run: |
          npx prisma generate --schema=packages/database/prisma/schema.prisma
          npx prisma migrate deploy --schema=packages/database/prisma/schema.prisma
          npx tsx packages/database/prisma/seed.ts || true

      - name: Install Python API
        if: steps.keys.outputs.configured == 'true'
        run: |
          cd apps/api
          python3 -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Start API server
        if: steps.keys.outputs.configured == 'true'
        run: |
          cd apps/api
          .venv/bin/uvicorn smartroute.main:app --host 0.0.0.0 --port 3001 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/health && break
            sleep 2
          done
          curl -sf http://localhost:3001/health

      - name: Full gateway smoke
        if: steps.keys.outputs.configured == 'true'
        run: |
          chmod +x scripts/test-gateway.sh
          API_URL="${{ inputs.api_url }}" ./scripts/test-gateway.sh
