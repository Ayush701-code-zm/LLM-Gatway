[project]
name = "smartroute-api"
version = "0.1.0"
description = "SmartRoute AI — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "redis>=5.2.0",
    "celery[redis]>=5.4.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=43.0.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",
    "pyotp>=2.9.0",
    "httpx>=0.28.0",
    "openai>=1.57.0",
    "anthropic>=0.40.0",
    "google-generativeai>=0.8.0",
    "stripe>=11.0.0",
    "prometheus-client>=0.21.0",
    "python-multipart>=0.0.17",
    "aiosmtplib>=3.0.0",
    "python3-saml>=1.16.0",
    "tiktoken>=0.8.0",
    "structlog>=24.4.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smartroute"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
