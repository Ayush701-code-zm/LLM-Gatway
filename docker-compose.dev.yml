version: '3.9'

# ===========================================================
# SmartRoute AI — Development overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ===========================================================

services:
  postgres:
    ports:
      - '5432:5432'
    environment:
      POSTGRES_PASSWORD: dev_password

  redis:
    ports:
      - '6379:6379'

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # Web UI + API

  # In development, run API (uvicorn) and Web outside Docker (`make dev`)
  # Only infrastructure services are started
  api:
    profiles: ['full']

  web:
    profiles: ['full']
