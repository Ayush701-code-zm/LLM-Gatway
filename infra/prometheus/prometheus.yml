global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: smartroute-ai
    environment: production

rule_files:
  - 'alerts/*.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: 'smartroute-api'
    static_configs:
      - targets: ['api:3001']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    # Requires redis_exporter if you want Redis metrics
    # Use redis_exporter image for full Redis metrics

  - job_name: 'node'
    static_configs:
      - targets: ['api:9100']
    # Requires node_exporter sidecar for OS-level metrics
